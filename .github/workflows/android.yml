name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle with retry
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
      - name: Unit tests, lint, debug APK, release bundle
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:bundleRelease :app:assembleDebugAndroidTest
      - name: Preserve unit test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle with retry
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: bash scripts/capture-demo.sh
      - name: Walkthrough screenshots
        if: matrix.api-level == 36
        uses: actions/upload-artifact@v4
        with:
          name: cookandpin-demo-screens
          path: app/build/demo-screens/*.png
          if-no-files-found: error
      - name: Preserve instrumentation results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-api-${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results/connected/
